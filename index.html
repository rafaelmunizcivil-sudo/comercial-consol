<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar de licitações</title>
<style>
  :root {
    --papel: #ECEEEE;
    --painel: #F7F8F8;
    --tinta: #1B2329;
    --tinta-2: #55626B;
    --linha: #CAD1D5;
    --asfalto: #2A333A;
    --asfalto-texto: #E8ECEE;
    --faixa: #F2B705;
    --alerta: #B93526;
    --ok: #2B7A4B;
    --link: #1F5FA8;
    --foco: #1F5FA8;
    --fonte: "Bahnschrift", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --papel: #1A2025;
      --painel: #222A30;
      --tinta: #E6EAEC;
      --tinta-2: #9AA7AF;
      --linha: #36424A;
      --asfalto: #12171B;
      --alerta: #E4695B;
      --ok: #5DB988;
      --link: #7FB2EE;
      --foco: #7FB2EE;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--papel); }
  body {
    margin: 0; background: var(--papel); color: var(--tinta);
    font: 15px/1.45 var(--fonte);
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  a { color: var(--link); }
  :focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }
  button, select, input { font: inherit; color: inherit; }

  /* Barra superior */
  .topo { background: var(--asfalto); color: var(--asfalto-texto); position: relative; }
  .topo-in { max-width: 1280px; margin: 0 auto; padding: 14px 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .topo h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: .01em; }
  .topo .estado { margin-left: auto; font-size: 13px; color: #B9C3C9; text-align: right; }
  .topo .estado.erro { color: #FFB4AA; }
  .btn { border: 1px solid #5B6A73; background: transparent; color: var(--asfalto-texto); padding: 6px 12px; border-radius: 3px; cursor: pointer; }
  .btn:hover { background: #38444C; }
  .btn:disabled { opacity: .5; cursor: default; }
  .progresso { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--faixa); width: 0; transition: width .4s linear; }

  /* Botões de órgãos */
  .orgaos { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; }
  .orgaos button { background: #1F5FA8; color: #fff; border: 2px solid transparent; border-radius: 3px; padding: 3px 10px; font-size: 12px; font-weight: 600; cursor: pointer; line-height: 1.5; }
  .orgaos button:hover { background: #174C87; }
  .orgaos button[aria-pressed="true"] { background: #0F3A6B; border-color: var(--faixa); }
  .orgaos button .q { font-weight: 400; opacity: .85; margin-left: 4px; }
  .orgaos button.zero { opacity: .55; }
  /* Painel do órgão */
  .painel-cab { background: var(--painel); border: 1px solid var(--linha); border-left: 4px solid #1F5FA8; padding: 12px 16px; margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
  .painel-cab h2 { margin: 0; font-size: 18px; }
  .painel-cab .sub { color: var(--tinta-2); font-size: 13px; flex: 1 1 260px; }
  .painel-cab .btn { color: var(--tinta); border-color: var(--linha); }
  .painel-cab .btn:hover { background: var(--papel); }
  .cartao { display: grid; grid-template-columns: 130px 1fr; gap: 6px 18px; background: var(--painel); border: 1px solid var(--linha); padding: 12px 16px; margin-bottom: 8px; }
  .cartao .c-prazo { border-right: 1px solid var(--linha); padding-right: 12px; font-variant-numeric: tabular-nums; }
  .cartao .c-prazo .data { display: block; font-size: 18px; font-weight: 600; }
  .cartao .c-prazo .hora { color: var(--tinta-2); font-size: 13px; }
  .cartao .c-prazo .falta { display: block; font-size: 13px; margin-top: 2px; color: var(--tinta-2); }
  .cartao .c-prazo.urgente .falta { color: var(--alerta); font-weight: 600; }
  .cartao .c-prazo.encerrada .data { text-decoration: line-through; color: var(--tinta-2); }
  .cartao.nova { box-shadow: inset 4px 0 0 var(--faixa); }
  .cartao .c-objeto { font-size: 15px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .cartao.aberta .c-objeto { display: block; }
  .cartao .c-meta { margin-top: 4px; font-size: 13px; color: var(--tinta-2); display: flex; flex-wrap: wrap; gap: 2px 16px; }
  .cartao .c-meta strong { color: var(--tinta); }
  .cartao .c-links { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13px; }
  .cartao .c-links a.edital { background: #1F5FA8; color: #fff; text-decoration: none; padding: 4px 10px; border-radius: 3px; font-weight: 600; }
  .cartao .c-links a.edital:hover { background: #174C87; }
  .cartao .c-links .fonte { color: var(--tinta-2); }
  @media (max-width: 640px) { .cartao { grid-template-columns: 1fr; } .cartao .c-prazo { border-right: 0; border-bottom: 1px solid var(--linha); padding: 0 0 6px; } }
  main { max-width: 1280px; margin: 0 auto; padding: 18px 20px 48px; }

  /* Régua de prazos */
  .regua-bloco { background: var(--painel); border: 1px solid var(--linha); padding: 12px 14px 10px; margin-bottom: 14px; }
  .regua-bloco h2 { margin: 0 0 2px; font-size: 15px; font-weight: 600; }
  .regua-bloco p { margin: 0 0 8px; font-size: 13px; color: var(--tinta-2); }
  .regua-rolagem { overflow-x: auto; }
  .regua { display: grid; grid-template-columns: repeat(31, minmax(24px, 1fr)); min-width: 780px; border-bottom: 2px solid var(--tinta); }
  .dia { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
         height: 92px; position: relative; padding-bottom: 20px; border-left: 1px solid transparent; }
  .dia.fds { background: color-mix(in srgb, var(--linha) 35%, transparent); }
  .dia:hover { background: color-mix(in srgb, var(--faixa) 22%, transparent); }
  .dia:focus-visible { outline: 2px solid var(--foco); outline-offset: -2px; }
  .dia .n { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; margin-bottom: 2px; min-height: 16px; }
  .dia .barra { width: 10px; background: var(--tinta-2); min-height: 0; }
  .dia.urgente .barra { background: var(--alerta); }
  .dia.urgente .n { color: var(--alerta); }
  .dia.marcado { background: var(--faixa); }
  .dia.marcado .barra { background: var(--tinta); }
  .dia.marcado .n { color: #1B2329; }
  .dia::after { content: ""; position: absolute; bottom: 0; left: 50%; width: 1px; height: 6px; background: var(--tinta); }
  .dia.eixo::after { height: 11px; width: 2px; }
  .dia .rot { position: absolute; bottom: 2px; left: 0; right: 0; text-align: center; font-size: 11px; color: var(--tinta-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .dia.marcado .rot { color: #1B2329; font-weight: 600; }

  /* Filtros */
  .filtros { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-bottom: 10px; }
  .filtros input[type="search"], .filtros select {
    background: var(--painel); border: 1px solid var(--linha); border-radius: 3px; padding: 6px 8px; min-height: 34px;
  }
  .filtros input[type="search"] { min-width: 240px; flex: 1 1 240px; }
  .opcoes { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; }
  .opcoes label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .resumo { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin: 4px 0 8px; font-size: 14px; color: var(--tinta-2); }
  .resumo strong { color: var(--tinta); font-variant-numeric: tabular-nums; }
  .resumo .legenda::before { content: ""; display: inline-block; width: 4px; height: 14px; background: var(--faixa); margin-right: 6px; vertical-align: -2px; }
  .resumo .btn { color: var(--tinta); border-color: var(--linha); margin-left: auto; }
  .resumo .btn:hover { background: var(--painel); }

  /* Lista */
  table { width: 100%; border-collapse: collapse; background: var(--painel); border: 1px solid var(--linha); }
  th { text-align: left; font-weight: 600; font-size: 13px; color: var(--tinta-2); padding: 8px 10px; border-bottom: 2px solid var(--tinta); white-space: nowrap; }
  td { padding: 10px; border-bottom: 1px solid var(--linha); vertical-align: top; }
  th.num, td.num { text-align: right; }
  tr.nova td:first-child { box-shadow: inset 4px 0 0 var(--faixa); }
  tr.descartada td { opacity: .55; }
  td.prazo { white-space: nowrap; width: 112px; }
  td.prazo .data { display: block; font-weight: 600; font-variant-numeric: tabular-nums; }
  td.prazo .hora, td.prazo .falta { display: block; font-size: 13px; color: var(--tinta-2); font-variant-numeric: tabular-nums; }
  td.prazo.urgente .falta { color: var(--alerta); font-weight: 600; }
  td.prazo.encerrada .data { text-decoration: line-through; }
  td.orgao { width: 230px; }
  td.orgao strong { display: block; font-weight: 600; }
  td.orgao span { font-size: 13px; color: var(--tinta-2); }
  td.objeto .texto { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  tr.aberta td.objeto .texto { -webkit-line-clamp: unset; display: block; }
  td.objeto .mod { display: block; margin-top: 4px; font-size: 13px; color: var(--tinta-2); }
  td.objeto .obs { display: none; margin-top: 8px; }
  tr.aberta td.objeto .obs { display: block; }
  td.objeto textarea { width: 100%; min-height: 56px; background: var(--papel); border: 1px solid var(--linha); border-radius: 3px; padding: 6px 8px; font: inherit; color: inherit; resize: vertical; }
  td.valor { white-space: nowrap; font-variant-numeric: tabular-nums; width: 130px; }
  td.valor .sem { color: var(--tinta-2); font-size: 13px; }
  td.acomp { width: 170px; }
  td.acomp select, td.acomp input { width: 100%; background: var(--papel); border: 1px solid var(--linha); border-radius: 3px; padding: 5px 6px; margin-bottom: 6px; }
  td.acomp select.st-participando { border-color: var(--ok); color: var(--ok); }
  td.acomp select.st-analisando { border-color: var(--link); }
  td.links { white-space: nowrap; width: 84px; font-size: 14px; }
  td.links a { display: block; }

  .vazio { padding: 28px 12px; text-align: center; color: var(--tinta-2); background: var(--painel); border: 1px solid var(--linha); }
  .mais { display: block; margin: 12px auto 0; background: var(--painel); border: 1px solid var(--linha); padding: 8px 18px; border-radius: 3px; cursor: pointer; }
  .aviso { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--asfalto); color: var(--asfalto-texto); padding: 10px 16px; border-radius: 3px; max-width: 90vw; }
  .aviso[hidden] { display: none; }

  .entrada { position: fixed; inset: 0; background: color-mix(in srgb, var(--asfalto) 88%, transparent); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 5; }
  .entrada[hidden] { display: none; }
  .entrada form { background: var(--painel); border: 1px solid var(--linha); border-top: 6px solid var(--faixa); padding: 22px 22px 18px; width: min(380px, 100%); }
  .entrada h2 { margin: 0 0 6px; font-size: 18px; }
  .entrada p { margin: 0 0 12px; color: var(--tinta-2); font-size: 14px; }
  .entrada input { width: 100%; background: var(--papel); border: 1px solid var(--linha); border-radius: 3px; padding: 8px; margin-bottom: 8px; }
  .entrada .msg { color: var(--alerta); min-height: 20px; font-size: 14px; }
  .entrada button { background: var(--asfalto); color: var(--asfalto-texto); border: 0; padding: 8px 18px; border-radius: 3px; cursor: pointer; }

  @media (max-width: 900px) {
    thead { display: none; }
    table, tbody, tr, td { display: block; width: auto !important; }
    tr { border-bottom: 2px solid var(--linha); padding: 8px 0; }
    td { border: 0; padding: 4px 10px; }
    td.num, td.valor { text-align: left; }
    td.prazo .data, td.prazo .hora, td.prazo .falta { display: inline; margin-right: 8px; }
    td.links a { display: inline; margin-right: 12px; }
  }
  @media (prefers-reduced-motion: reduce) { .progresso { transition: none; } }

  .topo .estado a { color: inherit; }
  .topo .link { color: var(--asfalto-texto); font-size: 13px; }
  .aviso-dados { background: #FFF3CD; color: #4D3B00; border: 1px solid #E5C65A; padding: 10px 14px; margin-bottom: 14px; }
  @media (prefers-color-scheme: dark) { .aviso-dados { background: #3A3210; color: #F5E7A6; border-color: #7A6A20; } }
  .aviso-dados[hidden] { display: none; }
</style>
</head>
<body>

<header class="topo">
  <div class="topo-in">
    <h1>Radar de licitações</h1>
    <div class="estado" id="estado" role="status" aria-live="polite">Carregando…</div>
    <a class="link" id="linkColetas" href="https://github.com/rafaelmunizcivil-sudo/comercial-consol/actions/workflows/coletar.yml" target="_blank" rel="noopener">Ver coletas</a>
  </div>
</header>

<main>
  <nav class="orgaos" id="orgaos" aria-label="Órgãos"></nav>
  <div class="aviso-dados" id="avisoDados" hidden></div>

  <section class="regua-bloco" aria-labelledby="tituloRegua">
    <h2 id="tituloRegua">Encerramentos nos próximos 30 dias</h2>
    <p>Cada coluna é um dia. Clique em um dia para listar só o que encerra nele.</p>
    <div class="regua-rolagem"><div class="regua" id="regua"></div></div>
  </section>

  <section class="filtros" aria-label="Filtros">
    <input type="search" id="fBusca" placeholder="Buscar por objeto, órgão ou cidade" aria-label="Buscar">
    <select id="fUf" aria-label="Estado"><option value="">Todos os estados</option></select>
    <select id="fMod" aria-label="Modalidade"><option value="">Todas as modalidades</option></select>
    <div class="opcoes">
      <label><input type="checkbox" id="fRelevantes" checked> Só relevantes</label>
      <label><input type="checkbox" id="fEncerradas" checked> Ocultar encerradas</label>
      <label><input type="checkbox" id="fRodoviarios"> Só órgãos rodoviários</label>
      <label><input type="checkbox" id="fNovas"> Só novas</label>
    </div>
  </section>

  <div class="resumo" id="resumo"></div>
  <div id="lista"></div>
</main>

<script>
"use strict";
// De onde vem a lista. A primeira tenta o arquivo direto do repositório (sempre o mais novo);
// a segunda, o arquivo publicado junto com esta página.
const FONTES = [
  "https://raw.githubusercontent.com/rafaelmunizcivil-sudo/comercial-consol/main/licitacoes.json",
  "licitacoes.json",
];
// Botões de órgãos. "uf" restringe ao estado; "rx" procura no nome do órgão/unidade (sem acento, minúsculo).
// "sites" são os links oficiais do órgão (aparecem no painel). Para acrescentar um: { t: "Texto do link", u: "https://..." }.
const ORGAOS = [
  { id: "dnit", nome: "DNIT", desc: "Departamento Nacional de Infraestrutura de Transportes", rx: /departamento nacional de infraestrutura|\bdnit\b/, sites: [{ t: "Editais de licitações (superintendências)", u: "https://www.gov.br/dnit/pt-br/assuntos/licitacoes/superintendencias/editais-de-licitacoes" }] },
  { id: "derac", nome: "DER-AC", desc: "Departamento de Estradas de Rodagem do Acre", uf: "AC", rx: /estradas de rodagem|\bder\b|\bder-ac\b|departamento de estradas/, sites: [{ t: "Site do órgão", u: "https://deracre.ac.gov.br/" }] },
  { id: "deral", nome: "DER-AL", desc: "Departamento de Estradas de Rodagem de Alagoas", uf: "AL", rx: /estradas de rodagem|\bder\b|\bder-al\b|departamento de estradas/, sites: [{ t: "Site do órgão", u: "https://www.der.al.gov.br/" }] },
  { id: "seinfraap", nome: "SEINFRA-AP", desc: "Infraestrutura do Amapá", uf: "AP", rx: /infraestrutura|seinfra|sinfra|seinf|obras|transportes/, sites: [{ t: "Site do governo", u: "https://amapa.gov.br/" }] },
  { id: "seinfraam", nome: "SEINFRA-AM", desc: "Infraestrutura do Amazonas", uf: "AM", rx: /infraestrutura|seinfra|sinfra|seinf|obras|transportes/, sites: [{ t: "Portal de compras (e-Compras AM)", u: "https://www.e-compras.am.gov.br/publico/" }] },
  { id: "ba", nome: "Infra BA", desc: "Secretaria de Infraestrutura da Bahia", uf: "BA", rx: /infraestrutura|seinfra|derba|\bder\b/, sites: [{ t: "Secretaria de Infraestrutura", u: "https://www.ba.gov.br/infraestrutura/" },{ t: "ComprasNet BA", u: "https://www.comprasnet.ba.gov.br/" }] },
  { id: "derdf", nome: "DER-DF", desc: "Departamento de Estradas de Rodagem do Distrito Federal", uf: "DF", rx: /estradas de rodagem|\bder\b|\bder-df\b|departamento de estradas/, sites: [{ t: "Site do órgão", u: "https://www.der.df.gov.br/" }] },
  { id: "deres", nome: "DER-ES", desc: "Departamento de Edificações e de Estradas de Rodagem do Espírito Santo", uf: "ES", rx: /estradas de rodagem|\bder\b|\bder-es\b|departamento de estradas/, sites: [{ t: "Licitações (portal de serviços)", u: "https://portalservicos.der.es.gov.br/Licitacao/Licitacoes" }] },
  { id: "goinfra", nome: "GOINFRA", desc: "Agência Goiana de Infraestrutura e Transportes", uf: "GO", rx: /goinfra|agencia goiana de infraestrutura/, sites: [{ t: "Portal de licitações (SGL)", u: "https://sgl.goinfra.go.gov.br/portal_licitacao/" },{ t: "Site do órgão", u: "https://www.goinfra.go.gov.br/" }] },
  { id: "sinframa", nome: "SINFRA-MA", desc: "Infraestrutura do Maranhão", uf: "MA", rx: /infraestrutura|seinfra|sinfra|seinf|obras|transportes/, sites: [{ t: "Portal de compras do MA", u: "https://www.compras.ma.gov.br/portal/" }] },
  { id: "sinframt", nome: "SINFRA-MT", desc: "Secretaria de Estado de Infraestrutura e Logística do Mato Grosso", uf: "MT", rx: /infraestrutura|sinfra/, sites: [{ t: "Site do órgão", u: "https://www.sinfra.mt.gov.br/" }] },
  { id: "agesul", nome: "AGESUL", desc: "Agência Estadual de Gestão de Empreendimentos (MS)", uf: "MS", rx: /agesul|gestao de empreendimentos|infraestrutura|obras/, sites: [{ t: "Site do órgão", u: "https://www.agesul.ms.gov.br/" }] },
  { id: "dermg", nome: "DER-MG", desc: "Departamento de Edificações e Estradas de Rodagem de Minas Gerais", uf: "MG", rx: /estradas de rodagem|\bder\b|\bder-mg\b|departamento de estradas/, sites: [{ t: "Pregões", u: "https://der.mg.gov.br/transparencia/licitacoes/pregoes/502-licitacoes" },{ t: "Concorrências", u: "https://www.der.mg.gov.br/transparencia/licitacoes/concorrencias" }] },
  { id: "derpb", nome: "DER-PB", desc: "Departamento de Estradas de Rodagem da Paraíba", uf: "PB", rx: /estradas de rodagem|\bder\b|\bder-pb\b|departamento de estradas/, sites: [{ t: "Site do órgão", u: "https://der.pb.gov.br/" }] },
  { id: "derpr", nome: "DER-PR", desc: "Departamento de Estradas de Rodagem do Paraná", uf: "PR", rx: /estradas de rodagem|\bder\b|\bder-pr\b|departamento de estradas/, sites: [{ t: "Licitações", u: "https://www.der.pr.gov.br/Pagina/Licitacoes" },{ t: "Site do órgão", u: "https://www.der.pr.gov.br/" }] },
  { id: "amep", nome: "AMEP-PR", desc: "AMEP (Paraná)", uf: "PR", rx: /\bamep\b|metropolitan/, sites: [{ t: "Concorrências", u: "https://www.amep.pr.gov.br/concorrencia" }] },
  { id: "derpe", nome: "DER-PE", desc: "Departamento de Estradas de Rodagem de Pernambuco", uf: "PE", rx: /estradas de rodagem|\bder\b|\bder-pe\b|departamento de estradas/, sites: [{ t: "Site do órgão", u: "https://www.der.pe.gov.br/" }] },
  { id: "seinfrapi", nome: "SEINFRA-PI", desc: "Infraestrutura do Piauí", uf: "PI", rx: /infraestrutura|seinfra|sinfra|seinf|obras|transportes/, sites: [{ t: "Site do governo", u: "https://www.pi.gov.br/" }] },
  { id: "derrj", nome: "DER-RJ", desc: "Departamento de Estradas de Rodagem do Rio de Janeiro", uf: "RJ", rx: /estradas de rodagem|\bder\b|\bder-rj\b|departamento de estradas/, sites: [{ t: "Site do órgão", u: "https://www.der.rj.gov.br/" }] },
  { id: "dernrn", nome: "DER-RN", desc: "Departamento de Estradas de Rodagem do Rio Grande do Norte", uf: "RN", rx: /estradas de rodagem|\bder\b|\bder-rn\b|departamento de estradas/, sites: [{ t: "Site do órgão", u: "https://www.der.rn.gov.br/" }] },
  { id: "daer", nome: "DAER-RS", desc: "Departamento Autônomo de Estradas de Rodagem do Rio Grande do Sul", uf: "RS", rx: /daer|estradas de rodagem|\bder\b/, sites: [{ t: "Site do órgão", u: "https://www.daer.rs.gov.br/inicial" }] },
  { id: "derro", nome: "DER-RO", desc: "Departamento de Estradas de Rodagem de Rondônia", uf: "RO", rx: /estradas de rodagem|\bder\b|\bder-ro\b|departamento de estradas/, sites: [{ t: "Site do órgão", u: "https://rondonia.ro.gov.br/der/" }] },
  { id: "seinfrr", nome: "SEINF-RR", desc: "Infraestrutura de Roraima", uf: "RR", rx: /infraestrutura|seinfra|sinfra|seinf|obras|transportes/, sites: [{ t: "Portal do governo", u: "https://portal.rr.gov.br/" }] },
  { id: "sie", nome: "SIE-SC", desc: "Secretaria de Estado da Infraestrutura de Santa Catarina", uf: "SC", rx: /infraestrutura|deinfra|\bsie\b/, sites: [{ t: "Site da SIE", u: "https://www.sie.sc.gov.br/" },{ t: "Portal de compras (SEA-SC)", u: "https://portal.doe.sea.sc.gov.br/v2.44.07/#/portal" }] },
  { id: "dersp", nome: "DER-SP", desc: "Departamento de Estradas de Rodagem de São Paulo", uf: "SP", rx: /estradas de rodagem|\bder\b|\bder-sp\b|departamento de estradas/, sites: [{ t: "Site do órgão", u: "https://www.der.sp.gov.br/der" }] },
  { id: "derse", nome: "DER-SE", desc: "Departamento de Estradas de Rodagem de Sergipe", uf: "SE", rx: /estradas de rodagem|\bder\b|\bder-se\b|departamento de estradas/, sites: [{ t: "Acervo de licitações", u: "https://der.se.gov.br/acervo_licitacoes/" }] },
  { id: "seinfto", nome: "SEINF-TO", desc: "Infraestrutura do Tocantins", uf: "TO", rx: /infraestrutura|seinfra|sinfra|seinf|obras|transportes/, sites: [{ t: "Site do governo", u: "https://www.to.gov.br/" }] },
  { id: "artemig", nome: "ARTEMIG", desc: "Agência Reguladora de Transportes do Estado de Minas Gerais", uf: "MG", rx: /artemig|reguladora de transportes/, sites: [] },
];
const ORGAO_OUTROS = { id: "outros", nome: "Outros órgãos", desc: "Demais órgãos que publicaram licitações relevantes" };
function orgaoDe(it) {
  if (it._org) return it._org;
  const t = norm((it.orgao || "") + " " + (it.unidade || ""));
  let achou = ORGAO_OUTROS.id;
  for (const o of ORGAOS) {
    if (o.uf && o.uf !== it.uf) continue;
    if (o.rx.test(t)) { achou = o.id; break; }
  }
  it._org = achou; return achou;
}
const F = { orgao: null, busca: "", uf: "", mod: "", relevantes: true, ocultarEncerradas: true, rodoviarios: false, novas: false, dia: null, limite: 100 };
let DADOS = { itens: [], gerado_em: null, consultas: 0, consultas_com_erro: 0 };
let VISITA_ANTERIOR = null;   // quando você abriu o Radar da vez anterior (só neste navegador)

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const urlSegura = u => /^https?:\/\//i.test(u || "") ? u : "";
const dois = n => String(n).padStart(2, "0");
const inicioDia = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const chaveDia = d => d.getFullYear() + "-" + dois(d.getMonth() + 1) + "-" + dois(d.getDate());
const fmtData = d => dois(d.getDate()) + "/" + dois(d.getMonth() + 1) + "/" + d.getFullYear();
const fmtHora = d => dois(d.getHours()) + "h" + dois(d.getMinutes());
const diasAte = d => Math.round((inicioDia(d) - inicioDia(new Date())) / 86400000);
const moeda = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });

function salvarFiltros() {
  try { localStorage.setItem("radar-filtros", JSON.stringify({ relevantes: F.relevantes, ocultarEncerradas: F.ocultarEncerradas, rodoviarios: F.rodoviarios, uf: F.uf, mod: F.mod })); } catch (e) { /* sem armazenamento */ }
}
function lerFiltros() {
  try { const s = JSON.parse(localStorage.getItem("radar-filtros") || "null"); if (s) Object.assign(F, s); } catch (e) { /* ignora */ }
  try { VISITA_ANTERIOR = localStorage.getItem("radar-visita") || null; } catch (e) { VISITA_ANTERIOR = null; }
}
function marcarVisita() {
  const agora = new Date(); const t = agora.getFullYear() + "-" + dois(agora.getMonth() + 1) + "-" + dois(agora.getDate()) + "T" + dois(agora.getHours()) + ":" + dois(agora.getMinutes()) + ":" + dois(agora.getSeconds());
  try { localStorage.setItem("radar-visita", t); } catch (e) { /* sem armazenamento */ }
  VISITA_ANTERIOR = t;
}

const ehNova = it => !!VISITA_ANTERIOR && !!it.primeira_vez && it.primeira_vez > VISITA_ANTERIOR;

function filtrar(ignorarDia, ignorarOrgao) {
  const agora = new Date();
  const q = norm(F.busca);
  return DADOS.itens.filter(it => {
    if (F.relevantes && !it.relevante) return false;
    if (!ignorarOrgao && F.orgao && orgaoDe(it) !== F.orgao) return false;
    if (F.rodoviarios && !it.rodoviario) return false;
    if (F.uf && it.uf !== F.uf) return false;
    if (F.mod && it.modalidade !== F.mod) return false;
    if (F.novas && !ehNova(it)) return false;
    const enc = it.encerramento ? new Date(it.encerramento) : null;
    if (F.ocultarEncerradas && enc && enc < agora) return false;
    if (!ignorarDia && F.dia && (!enc || chaveDia(enc) !== F.dia)) return false;
    if (q) {
      const palheiro = norm([it.objeto, it.orgao, it.unidade, it.municipio, it.numero + "/" + it.ano].join(" "));
      if (!palheiro.includes(q)) return false;
    }
    return true;
  });
}

function ordenar(lista) {
  return lista.slice().sort((a, b) => {
    const ea = a.encerramento || "9999", eb = b.encerramento || "9999";
    return ea < eb ? -1 : ea > eb ? 1 : 0;
  });
}

function renderRegua() {
  const base = filtrar(true);
  const hoje = inicioDia(new Date());
  const cont = new Array(31).fill(0);
  base.forEach(it => {
    if (!it.encerramento) return;
    const k = Math.round((inicioDia(new Date(it.encerramento)) - hoje) / 86400000);
    if (k >= 0 && k <= 30) cont[k]++;
  });
  const maximo = Math.max(1, ...cont);
  let html = "";
  for (let k = 0; k <= 30; k++) {
    const d = new Date(hoje); d.setDate(d.getDate() + k);
    const chave = chaveDia(d);
    const n = cont[k];
    const altura = n ? Math.max(6, Math.round(n / maximo * 46)) : 0;
    const cls = ["dia", (d.getDay() === 0 || d.getDay() === 6) ? "fds" : "", k <= 3 ? "urgente" : "", k % 7 === 0 ? "eixo" : "", F.dia === chave ? "marcado" : ""].join(" ");
    const rotulo = (k % 7 === 0 || F.dia === chave) ? dois(d.getDate()) + "/" + dois(d.getMonth() + 1) : "";
    const leitura = n + (n === 1 ? " licitação encerra" : " licitações encerram") + " em " + fmtData(d);
    html += `<button type="button" class="${cls}" data-dia="${chave}" aria-pressed="${F.dia === chave}" aria-label="${esc(leitura)}" title="${esc(leitura)}">` +
      `<span class="n">${n || ""}</span><span class="barra" style="height:${altura}px"></span><span class="rot">${rotulo}</span></button>`;
  }
  $("regua").innerHTML = html;
}

function linhaHTML(it) {
  const enc = it.encerramento ? new Date(it.encerramento) : null;
  let classePrazo = "", falta = "sem prazo informado", data = "—", hora = "";
  if (enc) {
    const dias = diasAte(enc);
    data = fmtData(enc); hora = fmtHora(enc);
    if (enc < new Date()) { classePrazo = "encerrada"; falta = "encerrada"; }
    else if (dias === 0) { classePrazo = "urgente"; falta = "hoje"; }
    else if (dias === 1) { classePrazo = "urgente"; falta = "amanhã"; }
    else { classePrazo = dias <= 3 ? "urgente" : ""; falta = "em " + dias + " dias"; }
  }
  const local = [it.unidade, [it.municipio, it.uf].filter(Boolean).join("/")].filter(Boolean).join(", ");
  const valor = (typeof it.valor === "number") ? moeda.format(it.valor) : '<span class="sem">não informado</span>';
  const lPncp = urlSegura(it.link_pncp), lOrig = urlSegura(it.link_origem);
  const nova = ehNova(it);
  return `<tr data-id="${esc(it.id)}" class="${nova ? "nova" : ""}">
    <td class="prazo ${classePrazo}">${nova ? '<span class="sr">Nova. </span>' : ""}<span class="data">${data}</span><span class="hora">${hora}</span><span class="falta">${falta}</span></td>
    <td class="orgao"><strong>${esc(it.orgao)}</strong><span>${esc(local)}</span></td>
    <td class="objeto"><div class="texto" title="Clique para ver o texto completo">${esc(it.objeto)}</div>
      <span class="mod">${esc(it.modalidade)} ${esc(it.numero)}${it.ano ? "/" + esc(it.ano) : ""}${it.situacao ? ", " + esc(it.situacao) : ""}</span></td>
    <td class="num valor">${valor}</td>
    <td class="links">${lPncp ? `<a href="${esc(lPncp)}" target="_blank" rel="noopener">Edital no PNCP</a>` : ""}${lOrig ? `<a href="${esc(lOrig)}" target="_blank" rel="noopener">Sistema do órgão</a>` : ""}</td>
  </tr>`;
}

function renderOrgaos() {
  const base = filtrar(false, true);
  const cont = {};
  base.forEach(it => { const k = orgaoDe(it); cont[k] = (cont[k] || 0) + 1; });
  const lista = ORGAOS.concat([ORGAO_OUTROS]);
  $("orgaos").innerHTML = `<button type="button" data-org="" aria-pressed="${!F.orgao}">Todos<span class="q">${base.length}</span></button>` +
    lista.map(o => `<button type="button" data-org="${o.id}" class="${cont[o.id] ? "" : "zero"}" aria-pressed="${F.orgao === o.id}" title="${esc(o.desc)}">${esc(o.nome)}<span class="q">${cont[o.id] || 0}</span></button>`).join("");
}

function cartaoHTML(it) {
  const enc = it.encerramento ? new Date(it.encerramento) : null;
  let cls = "", falta = "sem prazo informado", data = "—", hora = "";
  if (enc) {
    const dias = diasAte(enc); data = fmtData(enc); hora = fmtHora(enc);
    if (enc < new Date()) { cls = "encerrada"; falta = "encerrada"; }
    else if (dias === 0) { cls = "urgente"; falta = "encerra hoje"; }
    else if (dias === 1) { cls = "urgente"; falta = "encerra amanhã"; }
    else { cls = dias <= 3 ? "urgente" : ""; falta = "encerra em " + dias + " dias"; }
  }
  const local = [it.unidade, [it.municipio, it.uf].filter(Boolean).join("/")].filter(Boolean).join(", ");
  const valor = (typeof it.valor === "number") ? moeda.format(it.valor) : "não informado";
  const lPncp = urlSegura(it.link_pncp), lOrig = urlSegura(it.link_origem);
  const links = (lPncp ? `<a class="edital" href="${esc(lPncp)}" target="_blank" rel="noopener">Abrir edital no PNCP</a>` : "") +
    (lOrig ? `<a href="${esc(lOrig)}" target="_blank" rel="noopener">Sistema do órgão</a>` : "") +
    (lPncp || lOrig ? `<span class="fonte">Fonte: PNCP (pncp.gov.br)</span>` : `<span class="fonte">Sem link disponível</span>`);
  const nova = ehNova(it);
  return `<article class="cartao ${nova ? "nova" : ""}" data-id="${esc(it.id)}">
    <div class="c-prazo ${cls}">${nova ? '<span class="sr">Nova. </span>' : ""}<span class="data">${data}</span><span class="hora">${hora ? "até " + hora : ""}</span><span class="falta">${falta}</span></div>
    <div><div class="c-objeto" title="Clique para ver o texto completo">${esc(it.objeto)}</div>
      <div class="c-meta"><span><strong>Valor:</strong> ${esc(valor)}</span><span>${esc(it.modalidade)} ${esc(it.numero)}${it.ano ? "/" + esc(it.ano) : ""}${it.situacao ? ", " + esc(it.situacao) : ""}</span><span>${esc(it.orgao)}${local ? " · " + esc(local) : ""}</span></div>
      <div class="c-links">${links}</div></div>
  </article>`;
}

function renderResumo(lista) {
  const novas = DADOS.itens.filter(ehNova).length;
  const agora = new Date();
  const sete = lista.filter(it => { if (!it.encerramento) return false; const e = new Date(it.encerramento); return e >= agora && diasAte(e) <= 7; }).length;
  let html = `<span><strong>${lista.length}</strong> na lista</span><span><strong>${sete}</strong> encerram em até 7 dias</span>`;
  html += `<span class="legenda"><strong>${novas}</strong> novas desde a sua última visita</span>`;
  if (F.dia) html += `<button class="btn" type="button" id="btnLimparDia">Limpar filtro de dia</button>`;
  else if (novas) html += `<button class="btn" type="button" id="btnVisto">Marcar novas como vistas</button>`;
  $("resumo").innerHTML = html;
}

function render() {
  renderOrgaos();
  renderRegua();
  const lista = ordenar(filtrar(false));
  renderResumo(lista);
  const alvo = $("lista");
  if (!DADOS.itens.length) {
    alvo.innerHTML = `<div class="vazio">A primeira coleta ainda não terminou. No GitHub, abra <strong>Actions &gt; Coletar licitações &gt; Run workflow</strong> para coletar agora; leva alguns minutos.</div>`;
    return;
  }
  if (!lista.length) {
    alvo.innerHTML = (F.orgao ? `<div class="painel-cab"><h2>${esc((ORGAOS.concat([ORGAO_OUTROS]).find(x => x.id === F.orgao) || {}).nome)}</h2><span class="sub"></span><button class="btn" type="button" id="btnFechar">Fechar painel</button></div>` : "") + `<div class="vazio">Nenhuma licitação com estes filtros. Desmarque “Só relevantes” ou limpe a busca para ampliar.</div>`;
    return;
  }
  const parte = lista.slice(0, F.limite);
  if (F.orgao) {
    const o = ORGAOS.concat([ORGAO_OUTROS]).find(x => x.id === F.orgao);
    const sites = (o && o.sites || []).filter(x => urlSegura(x.u));
    alvo.innerHTML = `<div class="painel-cab"><h2>${esc(o.nome)}</h2><span class="sub">${esc(o.desc)}. ${lista.length} licitação(ões) com os filtros atuais.</span>` +
      sites.map(x => `<a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.t)}</a>`).join("") +
      `<button class="btn" type="button" id="btnFechar">Fechar painel</button></div>` +
      parte.map(cartaoHTML).join("") +
      (lista.length > parte.length ? `<button class="mais" type="button" id="btnMais">Mostrar mais ${Math.min(100, lista.length - parte.length)} de ${lista.length - parte.length} restantes</button>` : "");
    return;
  }
  const abertas = new Set([...document.querySelectorAll("tr.aberta")].map(tr => tr.dataset.id));
  alvo.innerHTML = `<table><thead><tr><th>Prazo</th><th>Órgão</th><th>Objeto</th><th class="num">Valor estimado</th><th>Links</th></tr></thead><tbody>${parte.map(linhaHTML).join("")}</tbody></table>` +
    (lista.length > parte.length ? `<button class="mais" type="button" id="btnMais">Mostrar mais ${Math.min(100, lista.length - parte.length)} de ${lista.length - parte.length} restantes</button>` : "");
  alvo.querySelectorAll("tbody tr").forEach(tr => { if (abertas.has(tr.dataset.id)) tr.classList.add("aberta"); });
}

function preencherSelects() {
  const ufs = [...new Set(DADOS.itens.map(i => i.uf).filter(Boolean))].sort();
  const mods = [...new Set(DADOS.itens.map(i => i.modalidade).filter(Boolean))].sort();
  $("fUf").innerHTML = `<option value="">Todos os estados</option>` + ufs.map(u => `<option value="${esc(u)}">${esc(u)}</option>`).join("");
  $("fMod").innerHTML = `<option value="">Todas as modalidades</option>` + mods.map(u => `<option value="${esc(u)}">${esc(u)}</option>`).join("");
  $("fUf").value = F.uf; $("fMod").value = F.mod;
}

function textoEstado() {
  const el = $("estado"), av = $("avisoDados");
  el.classList.remove("erro"); av.hidden = true;
  if (!DADOS.gerado_em) { el.textContent = "Ainda sem coleta"; return; }
  const d = new Date(DADOS.gerado_em);
  el.textContent = "Atualizado em " + fmtData(d) + " às " + fmtHora(d);
  const horas = (Date.now() - d.getTime()) / 3600000;
  if (horas > 30) {
    av.hidden = false;
    av.textContent = "Atenção: a lista tem mais de um dia (" + Math.floor(horas / 24) + " dia(s)). A coleta automática pode ter falhado. Veja em “Ver coletas” (canto superior direito).";
  } else if (DADOS.consultas_com_erro) {
    el.textContent += ". " + DADOS.consultas_com_erro + " consulta(s) falharam nesta coleta.";
  }
}

async function buscarDados() {
  let ultimoErro = null;
  for (const base of FONTES) {
    try {
      const r = await fetch(base + (base.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    } catch (e) { ultimoErro = e; }
  }
  throw ultimoErro;
}

async function carregar() {
  const d = await buscarDados();
  const itens = Array.isArray(d.itens) ? d.itens : Object.values(d.itens || {});
  DADOS = { itens: itens, gerado_em: d.gerado_em || null, consultas: d.consultas || 0, consultas_com_erro: d.consultas_com_erro || 0 };
  preencherSelects();
  textoEstado();
  render();
}

function ligarEventos() {
  $("fBusca").addEventListener("input", e => { F.busca = e.target.value; F.limite = 100; render(); });
  $("fUf").addEventListener("change", e => { F.uf = e.target.value; F.limite = 100; salvarFiltros(); render(); });
  $("fMod").addEventListener("change", e => { F.mod = e.target.value; F.limite = 100; salvarFiltros(); render(); });
  [["fRelevantes", "relevantes"], ["fEncerradas", "ocultarEncerradas"], ["fRodoviarios", "rodoviarios"], ["fNovas", "novas"]].forEach(([id, chave]) => {
    $(id).checked = F[chave];
    $(id).addEventListener("change", e => { F[chave] = e.target.checked; F.limite = 100; salvarFiltros(); render(); });
  });
  $("orgaos").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    F.orgao = b.dataset.org || null; F.dia = null; F.limite = 100; render();
  });
  $("regua").addEventListener("click", e => {
    const b = e.target.closest(".dia"); if (!b) return;
    F.dia = (F.dia === b.dataset.dia) ? null : b.dataset.dia; F.limite = 100; render();
  });
  $("resumo").addEventListener("click", e => {
    if (e.target.id === "btnLimparDia") { F.dia = null; render(); }
    if (e.target.id === "btnVisto") { marcarVisita(); render(); }
  });
  $("lista").addEventListener("click", e => {
    if (e.target.id === "btnMais") { F.limite += 100; render(); return; }
    if (e.target.id === "btnFechar") { F.orgao = null; render(); return; }
    const obj = e.target.closest(".c-objeto");
    if (obj) { obj.closest(".cartao").classList.toggle("aberta"); return; }
    const texto = e.target.closest(".texto");
    if (texto) texto.closest("tr").classList.toggle("aberta");
  });
}

async function iniciar() {
  lerFiltros();
  $("fNovas").checked = false;
  ligarEventos();
  const primeiraVisita = !VISITA_ANTERIOR;
  try { await carregar(); }
  catch (e) {
    $("estado").textContent = "Não foi possível carregar a lista";
    $("estado").classList.add("erro");
    $("lista").innerHTML = `<div class="vazio">Não consegui ler o arquivo <strong>licitacoes.json</strong>. Confira se ele existe no repositório e se a internet está funcionando; depois recarregue a página.</div>`;
    return;
  }
  if (primeiraVisita) marcarVisita();   // na primeira vez, nada aparece como "nova"
  setInterval(async () => {
    if (document.hidden) return;
    const ativo = document.activeElement;
    if (ativo && /^(INPUT|TEXTAREA|SELECT)$/.test(ativo.tagName)) return;
    try { await carregar(); } catch (e) { /* tenta de novo no próximo ciclo */ }
  }, 600000);
}
iniciar();
</script>
