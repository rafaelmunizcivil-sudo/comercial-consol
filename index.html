<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radar de Licitações</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1b2430;
      --muted: #5b6776;
      --accent: #0b5cad;
      --accent-dark: #084680;
      --border: #dde3ea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11161d;
        --card: #1a212b;
        --text: #e8edf3;
        --muted: #9aa7b6;
        --accent: #4a9eed;
        --accent-dark: #2f86d8;
        --border: #2a3441;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }
    .tag {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 12px;
    }
    h1 { margin: 0 0 12px; font-size: 32px; line-height: 1.2; }
    p { margin: 0 0 24px; color: var(--muted); }
    .button {
      display: inline-block;
      padding: 14px 32px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 17px;
      border-radius: 10px;
      transition: background 0.15s ease;
    }
    .button:hover, .button:focus-visible { background: var(--accent-dark); }
    .sources {
      margin: 32px 0 0;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 14px;
      color: var(--muted);
    }
    footer { margin-top: 20px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <span class="tag">CONSOL · Área Comercial</span>
    <h1>Radar de Licitações</h1>
    <p>Acompanhe as licitações abertas por órgãos públicos de infraestrutura, reunidas em um só lugar.</p>
    <a class="button" href="https://script.google.com/macros/s/AKfycbw4NdX4IPNhUGg434w7rBiiFxipSpwGAvlXqsRkppCNEE8rxaGBnjyExOX77xdELy0r/exec" target="_blank" rel="noopener">Abrir o radar</a>
    <div class="sources">
      Fontes monitoradas: DNIT, DERs estaduais e outros órgãos de infraestrutura.
    </div>
    <footer>Ferramenta de uso interno da equipe comercial.</footer>
  </main>
</body>
</html>
