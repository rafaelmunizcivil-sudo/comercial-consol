name: Coletar licitações

on:
  schedule:
    - cron: "0 9 * * *"    # 06h em Brasília (coleta + aviso de prazos)
    - cron: "0 15 * * *"   # 12h em Brasília
    - cron: "0 21 * * *"   # 18h em Brasília
  workflow_dispatch:        # botão "Run workflow" para coletar na hora

permissions:
  contents: write           # grava licitacoes.json
  issues: write             # cria os avisos

concurrency:
  group: coletar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar no PNCP
        run: python coletar.py

      - name: Guardar a lista no repositório
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add licitacoes.json
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Atualiza licitações"
            git push
          fi

      - name: Avisar licitações novas
        if: hashFiles('novas.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "Novas licitações relevantes ($(date -d '-3 hours' +'%d/%m %Hh'))" --body-file novas.md

      - name: Montar aviso de prazos (só na coleta das 06h)
        if: github.event_name == 'schedule' && github.event.schedule == '0 9 * * *'
        run: python coletar.py --prazos

      - name: Avisar prazos
        if: hashFiles('prazos.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "Prazos: licitações encerrando logo ($(date -d '-3 hours' +'%d/%m'))" --body-file prazos.md
