      - name: Guardar a lista no repositório
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add licitacoes.json
          if git diff --cached --quiet; then
            echo "Sem mudanças na lista."
            exit 0
          fi
          git commit -m "Atualiza licitações"
          cp licitacoes.json /tmp/licitacoes.json
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/licitacoes.json licitacoes.json
            git add licitacoes.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Atualiza licitações"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
