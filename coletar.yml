name: Coletar licitações

on:
  schedule:
    - cron: "0 9,15,21 * * *"   # 06h, 12h e 18h no horário de Brasília
  workflow_dispatch:             # permite rodar na mão (botão "Run workflow")

permissions:
  contents: write

concurrency:
  group: coletar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar o coletor
        run: python coletar.py

      - name: Salvar o resultado
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add licitacoes.json
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Atualiza licitações"
            git push
          fi
